<!DOCTYPE html>
<html>
<head>
    <title>Fosozu-chan: WiFi Maiden - V1.4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="reset-overlay"><div id="reset-text">SERVER RESET</div><div id="iter-text">OVERCLOCKING...</div></div>
    <div id="warning-border"></div>
    <div id="continue-ui">
        <h1 style="color:#ff006e; font-size: 48px;">CONTINUE?</h1>
        <div id="continue-timer" style="font-size: 80px; margin: 20px 0;">10</div>
        <p style="font-size: 20px;">PRESS <span style="color:#00f2ff;">[C]</span> TO RECONNECT</p>
    </div>
    <div id="dialogue-box"><div id="dialogue-text" style="font-size: 20px; margin-bottom: 15px; color: #00f2ff;"></div><div style="font-size:12px; color: #ffca3a;">-- PRESS Z TO CONTINUE --</div></div>
    <div id="summary-box">
        <h2 id="summary-title" style="color:#00f2ff; margin-top:0;">WAVE ANALYTICS</h2>
        <div id="summary-content" style="text-align:left; font-size:18px; line-height:1.6; margin:20px 0;"></div>
        <div style="font-size:12px; color: #ffca3a;">-- PRESS Z TO SYNC --</div>
    </div>
    <div id="ui">
        SCORE: <span id="scoreVal">0</span><br>
        LINK ITERATION: <span id="ngVal" style="color:#ffca3a">1</span><br>
        GRAZE: <span id="grazeVal">0</span> (<span id="shieldStreak" style="color:#00f2ff">0</span>/10)<br>
        LIVES: <span id="livesVal">3</span><br>
        BOMBS: <span id="bombsVal">2</span>
        <div style="width:120px; height:8px; background:#222; border:1px solid #00f2ff; margin-top:5px;"><div id="bomb-meter-fill" style="width:0%; height:100%; background:#00f2ff;"></div></div>
        <span id="shieldStat" style="color:#00f2ff; display:none;">SHIELD ACTIVE!</span>
    </div>
    <div id="high-score-ui">HI-SCORE: <span id="hiScoreVal">0</span></div>
    <div id="fps-ui">FPS: <span id="fpsCounter">0</span></div>
    <div id="boss-ui"><span id="bossName">BOSS</span><div id="hp-bar-bg"><div id="hp-bar-fill"></div></div></div>
    <canvas id="gameCanvas"></canvas>

    <script src="js/audio.js"></script>
    <script src="js/bosses.js"></script>
    <script src="main.js"></script>
</body>
</html>
